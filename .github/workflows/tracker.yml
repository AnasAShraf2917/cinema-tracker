name: Cinema Tracker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache known dates
        uses: actions/cache@v3
        with:
          path: known_dates.txt
          key: cinema-dates-cache-${{ github.run_id }}
          restore-keys: |
            cinema-dates-cache-

      - name: Run scripts
        run: |
          python tracker.py
          python date_tracker.py
