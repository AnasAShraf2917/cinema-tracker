name: Cinema Tracker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache state files
        uses: actions/cache@v3
        with:
          path: |
            known_dates.txt
            notified_avengers.txt
          # Creates a brand-new save slot every run so it can't be blocked
          key: cinema-rolling-state-${{ github.run_id }}
          # Tells GitHub to load the most recent save file matching this prefix
          restore-keys: |
            cinema-rolling-state-

      - name: Run scripts
        run: |
          python tracker.py
          python date_tracker.py
