name: Cinema Tracker

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache state files
        uses: actions/cache@v3
        with:
          path: |
            known_dates.txt
            notified_avengers.txt
          key: cinema-state-v1

      - name: Run scripts
        run: |
          python tracker.py
          python date_tracker.py
